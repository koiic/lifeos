name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to Staging over SSH
        run: |
          echo "Deploying ${{ github.sha }} to staging environment..."
          # Deploy command per spec 14.5:
          # docker compose pull && docker compose run --rm migrate && docker compose up -d

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Production over SSH
        run: |
          echo "Deploying ${{ github.sha }} to production environment after approval..."
          # Deploy command per spec 14.5:
          # docker compose pull && docker compose run --rm migrate && docker compose up -d
