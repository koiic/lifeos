[project]
name = "lifeos-server"
version = "0.1.0"
description = "Life OS API and worker (spec 6, 11.1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "sqlalchemy[asyncio]==2.0.54",
    "structlog==26.1.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "import-linter==2.15",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
]

# ---------- ruff (plan 4.2) ----------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "PT", "SIM", "RUF", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Tooling tests run the repository's own pinned CLIs (commitlint, stylelint, hook scripts).
"tests/tooling/**" = ["S101", "S603"]

# ---------- mypy (plan 4.2) ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Plan 4.2: no `# type: ignore` without a reason (an error code at minimum).
enable_error_code = ["ignore-without-code"]

# ---------- pytest (plan 4.7) ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "req(*ids): requirement IDs this test proves (plan 6.2)",
    "integration: needs the real PostgreSQL database",
]

# ---------- import-linter (plan 4.2) ----------
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Each module is layered api/jobs -> service -> repo"
type = "layers"
containers = ["app.auth", "app.core", "app.health", "app.notify", "app.data", "app.admin"]
layers = ["api | jobs", "service", "repo"]

[[tool.importlinter.contracts]]
name = "Only platform/crypto.py imports cryptography"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["cryptography"]
ignore_imports = ["app.platform.crypto -> cryptography"]
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "Only repo.py files use SQLAlchemy in modules"
type = "forbidden"
source_modules = ["app.*.api", "app.*.service", "app.*.jobs"]
forbidden_modules = ["sqlalchemy"]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "auth repo is used only by auth service"
type = "protected"
protected_modules = ["app.auth.repo"]
allowed_importers = ["app.auth.service"]

[[tool.importlinter.contracts]]
name = "core repo is used only by core service"
type = "protected"
protected_modules = ["app.core.repo"]
allowed_importers = ["app.core.service"]

[[tool.importlinter.contracts]]
name = "health repo is used only by health service"
type = "protected"
protected_modules = ["app.health.repo"]
allowed_importers = ["app.health.service"]

[[tool.importlinter.contracts]]
name = "notify repo is used only by notify service"
type = "protected"
protected_modules = ["app.notify.repo"]
allowed_importers = ["app.notify.service"]

[[tool.importlinter.contracts]]
name = "data repo is used only by data service"
type = "protected"
protected_modules = ["app.data.repo"]
allowed_importers = ["app.data.service"]

[[tool.importlinter.contracts]]
name = "admin repo is used only by admin service"
type = "protected"
protected_modules = ["app.admin.repo"]
allowed_importers = ["app.admin.service"]
