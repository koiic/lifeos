[project]
name = "lifeos-server"
version = "0.1.0"
description = "Life OS API and worker (spec 6, 11.1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # pywebpush's async transport, used directly to refuse redirects (CR-027).
    "aiohttp==3.14.4",
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "asyncpg==0.32.0",
    "cryptography==50.0.2",
    "fastapi==0.142.2",
    "procrastinate==3.10.0",
    "pydantic==2.13.5",
    "pyotp==2.10.0",
    "pywebpush==2.5.0",
    "sqlalchemy[asyncio]==2.0.54",
    "structlog==26.1.0",
    "uuid6==2025.0.1",
    "uvicorn==0.54.0",
    "webauthn==3.0.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "import-linter==2.15",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
]

# ---------- ruff (plan 4.2) ----------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "PT", "SIM", "RUF", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# These run the repository's own tools, Alembic or the worker entrypoint in subprocesses.
"tests/conftest.py" = ["S101", "S603"]
"tests/jobs/test_registration.py" = ["S101", "S603"]
# Tooling tests run the repository's own pinned CLIs (commitlint, stylelint, hook scripts).
"tests/tooling/**" = ["S101", "S603"]
# DB tests bootstrap roles and run Alembic in a subprocess (env.py owns its event loop).
"tests/db/**" = ["S101", "S603"]
# Auth tests use fixed fake passwords on purpose.
"tests/auth/**" = ["S101", "S105", "S106"]
# Migrations carry the spec's DDL verbatim (spec 7.2, 7.5), long lines included.
"migrations/versions/**" = ["E501"]

# ---------- mypy (plan 4.2) ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Plan 4.2: no `# type: ignore` without a reason (an error code at minimum).
enable_error_code = ["ignore-without-code"]

# pywebpush (spec 6.1) ships no type information; its two entry points used in notify/sender.py
# are wrapped there with typed results.
[[tool.mypy.overrides]]
module = ["pywebpush", "http_ece"]
ignore_missing_imports = true

# ---------- pytest (plan 4.7) ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "req(*ids): requirement IDs this test proves (plan 6.2)",
    "integration: needs the real PostgreSQL database",
]

# ---------- import-linter (plan 4.2) ----------
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Each module is layered api/jobs -> service -> repo"
type = "layers"
containers = ["app.auth", "app.core", "app.health", "app.notify", "app.data", "app.admin"]
layers = ["api | jobs", "service", "repo"]

[[tool.importlinter.contracts]]
name = "Only platform/crypto.py imports cryptography"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["cryptography"]
ignore_imports = ["app.platform.crypto -> cryptography"]
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "Only repo.py files use SQLAlchemy in modules"
type = "forbidden"
# The six business modules only (platform code is exempt; `app.*.jobs` would match
# app.platform.jobs).
source_modules = [
    "app.auth.api",
    "app.auth.service",
    "app.auth.jobs",
    "app.core.api",
    "app.core.service",
    "app.core.jobs",
    "app.health.api",
    "app.health.service",
    "app.health.jobs",
    "app.notify.api",
    "app.notify.service",
    "app.notify.jobs",
    "app.data.api",
    "app.data.service",
    "app.data.jobs",
    "app.admin.api",
    "app.admin.service",
    "app.admin.jobs",
]
forbidden_modules = ["sqlalchemy"]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "auth repo is used only by auth service"
type = "protected"
protected_modules = ["app.auth.repo"]
allowed_importers = ["app.auth.service"]

[[tool.importlinter.contracts]]
name = "core repo is used only by core service"
type = "protected"
protected_modules = ["app.core.repo"]
allowed_importers = ["app.core.service"]

[[tool.importlinter.contracts]]
name = "health repo is used only by health service"
type = "protected"
protected_modules = ["app.health.repo"]
allowed_importers = ["app.health.service"]

[[tool.importlinter.contracts]]
name = "notify repo is used only by notify service"
type = "protected"
protected_modules = ["app.notify.repo"]
allowed_importers = ["app.notify.service"]

[[tool.importlinter.contracts]]
name = "data repo is used only by data service"
type = "protected"
protected_modules = ["app.data.repo"]
allowed_importers = ["app.data.service"]

[[tool.importlinter.contracts]]
name = "admin repo is used only by admin service"
type = "protected"
protected_modules = ["app.admin.repo"]
allowed_importers = ["app.admin.service"]
