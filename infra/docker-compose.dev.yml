# Local development and test database only (spec 14.4 "Local"). Fake data, local credentials.
# Production and staging Compose files come with the infrastructure task (T15).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos
      POSTGRES_DB: lifeos
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
